name: first workflow
on: push  # [ push, pull ]
jobs: 

  build_job_1: 
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: run shell script
      run: chmod 700 ascii-art.sh;./ascii-art.sh
    - name: upload file
      uses: actions/upload-artifact@v4
      with: 
        name: dragon-text-file
        path: dragon.txt
    - name: echo secret
      run: echo ${{ secrets.DOCKER_PASSWORD }}
    - name: echo variable
      run: echo ${{ variables.DOCKER_USERNAME }}

  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
    - name: download file
      uses: actions/download-artifact@v4
      with:
       name: dragon-text-file
    - name: Display structure of downloaded files
      run: ls -R
    - name: sleep command
      run: sleep 10
    - name: test file exists
      run: grep -i "dragon" dragon.txt

  deploy_job_3:
    needs: test_job_2
    runs-on: ubuntu-latest
    steps:
    - name: download file
      uses: actions/download-artifact@v4
      with:
       name: dragon-text-file
    - name: read file
      run: cat dragon.txt
    - name: deploy
      run: echo "deploying ..."
              
